name: CI Pipeline

# Запускать при пуше в любую ветку
on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Загрузить код из репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Войти в Docker Hub, используя сохраненные секреты
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Собрать образ для backend и отправить его на Docker Hub
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-backend:latest

      # 4. Собрать образ для frontend и отправить его на Docker Hub
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-frontend:latest
