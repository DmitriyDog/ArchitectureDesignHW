name: CI Pipeline with PostgreSQL

on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 1: Запускаем всё приложение для проверки работоспособности
      - name: Start services with Docker Compose
        run: docker-compose up -d --build

      # Шаг 2: Даем приложению больше времени на запуск (PostgreSQL инициализируется дольше)
      - name: Wait for services to be ready
        run: sleep 20

      # Шаг 3: Проверяем, что все контейнеры работают
      - name: Check running containers
        run: docker-compose ps

      # Шаг 4: Проверяем, что backend отвечает
      - name: Test backend endpoint
        run: |
          curl --fail http://localhost:5000 || exit 1

      # Шаг 5: Проверяем, что frontend отвечает
      - name: Test frontend endpoint
        run: |
          curl --fail http://localhost:8080 || exit 1

      # Шаг 6: Останавливаем контейнеры
      - name: Stop services
        run: docker-compose down

      # Шаги 7-9: Логинимся на Docker Hub и пушим образы (только если все проверки прошли)
      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-backend:latest

      - name: Build and push Frontend
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-frontend:latest
