name: Docker CI with Tests

on:
  push:
    branches: [ main, master, '*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    # Важно! Все команды будут выполняться в папке src
    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show structure
        run: |
          echo "Current directory:"
          pwd
          echo "Files in src:"
          ls -la

      - name: Start services
        run: |
          docker-compose up -d --build
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Check running containers
        run: docker-compose ps

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman tests
        run: |
          newman run postman-tests/collection.json \
            --reporters cli \
            --env-var "backend_url=http://localhost:5000" \
            --env-var "frontend_url=http://localhost:8080"

      - name: Stop services
        if: always()
        run: docker-compose down

      # Логинимся и пушим образы (только если тесты прошли)
      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-backend:latest

      - name: Build and push Frontend
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-frontend:latest
