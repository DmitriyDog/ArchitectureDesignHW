name: CI Pipeline with Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 1: Запускаем все сервисы
      - name: Start services with Docker Compose
        run: |
          docker-compose up -d --build
          echo "Waiting for services to be ready..."
          sleep 15

      # Шаг 2: Проверяем, что все контейнеры запущены
      - name: Check running containers
        run: docker-compose ps

      # Шаг 3: Устанавливаем Newman (бегун тестов Postman)
      - name: Install Newman
        run: npm install -g newman

      # Шаг 4: Запускаем интеграционные тесты
      - name: Run Postman Integration Tests
        run: |
          newman run postman-tests/collection.json \
            --reporters cli,json \
            --reporter-json-export test-results.json

      # Шаг 5: Сохраняем результаты тестов (опционально)
      - name: Upload test results
        if: always()  # Запускается даже при провале тестов
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.json

      # Шаг 6: Останавливаем сервисы
      - name: Stop services
        if: always()  # Останавливаем даже при провале тестов
        run: docker-compose down

      # Шаг 7: Логинимся и пушим образы (только если тесты прошли)
      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-backend:latest

      - name: Build and push Frontend
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-frontend:latest
