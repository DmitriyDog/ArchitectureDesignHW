name: Docker CI with Tests

on:
  push:
    branches: [ main, master, '*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show structure
        run: |
          echo "Current directory:"
          pwd
          echo "All files:"
          ls -la
          echo "Src directory:"
          ls -la src/ || echo "No src directory"

      - name: Move to src and run tests
        run: |
          cd src
          docker-compose up -d --build
          sleep 15
          docker-compose ps
          curl -f http://localhost:5000 || echo "Backend not ready"
          curl -f http://localhost:8080 || echo "Frontend not ready"
          docker-compose down
